<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Gulp Template</title>
  <link rel="stylesheet" href="dist/css/main.css" />
</head>
<body>
  <div class="container py-5">

    <h1 class="text-primary">Hola Bootstrap con Gulp + Sass 🎉</h1>
    <p class="lead">Este es un ejemplo para probar variables sobrescritas.</p>

    <!-- Botones personalizados -->
    <div class="mb-4">
      <button class="btn btn-primary me-2">Botón primario</button>
      <button class="btn btn-secondary me-2">Botón secundario</button>
      <button class="btn btn-success">Botón éxito</button>
    </div>

    <!-- Alertas -->
    <div class="alert alert-warning" role="alert">
      ¡Esta es una alerta de advertencia personalizada!
    </div>

    <!-- Tarjeta -->
    <div class="card" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Título de la tarjeta</h5>
        <p class="card-text">Texto dentro de la tarjeta para probar espaciado y fuentes.</p>
        <a href="#" class="btn btn-outline-primary">Acción</a>
      </div>
    </div>

  </div>

  <script src="dist/js/main.js"></script>
</body>
</html>
